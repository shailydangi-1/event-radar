# Event Radar config — edit this, not the code.

home:
  city_names: [gurugram, gurgaon, delhi, new delhi, noida, faridabad, ghaziabad, greater noida, ncr]
  luma_city_slugs: [delhi]          # lu.ma/delhi
  meetup_lat: 28.4595
  meetup_lon: 77.0266
  meetup_radius_miles: 40

india:
  luma_city_slugs: [bangalore, mumbai, hyderabad, pune, chennai, kolkata, ahmedabad, goa]
  eventbrite_places:                # eventbrite URL slugs
    - india--bengaluru
    - india--mumbai
    - india--new-delhi
    - india--hyderabad
    - india--pune

# What we type into the search boxes on sites that need a query (Meetup).
# Keep this short — every term is a separate page fetch.
search_terms: [artificial intelligence, machine learning, deep learning, hardware,
               robotics, startup founders, neurotech, medical devices]

# Relevance scoring. Weight = points added when the phrase appears
# in title/description. Anything scoring below min_score is dropped.
keywords:
  core:            # weight 5 — your actual work
    weight: 5
    terms: [bci, brain computer interface, brain-computer, neurotech, neurotechnology,
            eeg, emg, eog, fnirs, neural interface, neuromodulation, neuroscience,
            biosignal, biosensing, wearable, medical device, medtech, digital health,
            electrophysiology, ppg, bioelectronics, implant, prosthetic, neuralink]
  strong:          # weight 3
    weight: 3
    terms: [hardware, embedded, silicon, semiconductor, robotics, sensors, rf, radar,
            firmware, pcb, fpga, edge ai, chip, mems, photonics, signal processing,
            deep learning, machine learning, foundation model, llm, transformer,
            computer vision, speech, multimodal, ml systems, mlops, pytorch, cuda]
  network:         # weight 3 — founder / investor rooms
    weight: 3
    terms: [founder, founders, startup, yc, y combinator, demo day, pitch, vc,
            venture, angel, accelerator, incubator, seed round, hackathon, builders]
  weak:            # weight 1
    weight: 1
    terms: [ai, artificial intelligence, research, engineering, science, workshop,
            conference, summit, meetup, symposium]

# Kill list — instant drop regardless of score.
blocklist: [astrology, tarot, speed dating, mlm, network marketing, crypto pump,
            forex, weight loss challenge, nightlife, bollywood night, comedy open mic,
            yoga retreat, "digital marketing masterclass", dropshipping]

thresholds:
  home: 4          # local stuff — low bar, you can just show up
  india: 7         # travel within India — needs to be worth a flight
  global: 12       # only genuinely major

# Hand-verified events with known dates. These flow through scoring and regions
# exactly like scraped ones, so they appear in the NCR/India sections when they
# fall inside the digest window. Use this for the deep-tech conferences that
# can't be scraped: the sites that list them either block bots (10times,
# embs.org) or ship no machine-readable data (KonfHub, IIT Delhi, NASSCOM).
#
# Dates are announced a year out and rarely move. Check them each January.
curated_events:
  - name: SEMICON India 2026
    url: https://www.semiconindia.org/
    start: 2026-09-17
    end: 2026-09-19
    city: New Delhi
    venue: Yashobhoomi (India International Convention & Expo Centre), Dwarka
    topic: semiconductor silicon chip hardware fabrication electronics manufacturing MEMS packaging
  - name: India Mobile Congress 2026
    url: https://www.indiamobilecongress.com/
    start: 2026-10-07
    end: 2026-10-10
    city: New Delhi
    venue: Yashobhoomi (IICC), Dwarka
    topic: wireless devices hardware telecom 6G edge AI sensors embedded semiconductor
  - name: IANCON 2026 — Indian Academy of Neurology
    url: https://www.ianindia.org/events_list
    start: 2026-10-28
    end: 2026-11-01
    city: Jaipur
    topic: neurology neuroscience neuromodulation clinical medical device electrophysiology
  - name: Bengaluru Tech Summit 2026
    url: https://www.bengalurutechsummit.com/
    start: 2026-11-17
    end: 2026-11-19
    city: Bengaluru
    topic: deep learning machine learning hardware semiconductor robotics startup founders medtech
  - name: NSICON 2026 — Neurological Society of India
    url: https://neurosocietyindia.com/conferences/
    start: 2026-12-10
    end: 2026-12-13
    city: Ahmedabad
    topic: neuroscience neurosurgery neural interface neuromodulation implant medical device
  - name: Medical Fair India 2027
    url: https://www.medicalfair-india.com/
    start: 2027-03-13
    end: 2027-03-15
    city: New Delhi
    venue: Bharat Mandapam (Pragati Maidan), Halls 4 & 5
    topic: medical device medtech diagnostics wearable digital health implant bioelectronics

# Recurring conferences whose next dates aren't announced yet, or that are too
