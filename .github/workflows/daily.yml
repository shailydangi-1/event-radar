name: Event Radar

on:
  schedule:
    - cron: "30 1 * * *"      # ~07:00 IST daily (GitHub cron can drift 10-30 min)
  workflow_dispatch:           # lets you run it by hand from the Actions tab
  push:
    branches: [main]           # editing config.yaml rebuilds the page right away
    paths-ignore:
      - events.db              # the scan job commits the db back; without this
      - README.md              # that commit would trigger another scan, forever

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: event-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan sources and rebuild the page
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: python -m radar.main

      # Committing the database keeps "new since last run" accurate and counts
      # as repo activity, so GitHub never auto-disables the daily schedule.
      - name: Save the event database
        run: |
          git config user.name  "event-radar"
          git config user.email "actions@github.com"
          git add -f events.db
          # [skip ci] belts-and-braces with paths-ignore above: this commit must
          # never start another run of this workflow.
          git diff --staged --quiet || git commit -m "radar: $(date -u +%Y-%m-%d) scan [skip ci]"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
