name: Event Radar

on:
  schedule:
    - cron: "30 1 * * *"      # ~07:00 IST daily (GitHub cron can drift 10-30 min)
  workflow_dispatch:           # lets you run it by hand from the Actions tab
  push:
    branches: [main]           # editing config.yaml rebuilds the page right away
    paths-ignore:
      - events.db              # the scan job commits the db back; without this
      - README.md              # that commit would trigger another scan, forever

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: event-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan sources and rebuild the page
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: python -m radar.main

      # Publishing comes first, deliberately. Saving the database is a
      # convenience; getting the page out is the whole point, so nothing that
      # happens below is allowed to stand between a good scan and a deploy.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # Committing the database keeps "new since last run" accurate and counts
      # as repo activity, so GitHub never auto-disables the daily schedule.
      #
      # This races with your own pushes: a commit landing on main while a scan is
      # running leaves this job's checkout behind the remote, and the push is
      # rejected. Rebasing would be the usual answer, but events.db is a binary
      # file -- a rebase against another run's version conflicts and there's no
      # sane way to resolve it unattended.
      #
      # Instead: move HEAD *and the index* to whatever is on the remote now,
      # leaving the working tree alone so our freshly scanned events.db
      # survives, then stage only that one path. Ours is the newest scan, so
      # "ours wins" is always the correct resolution for the database, and the
      # push is a fast-forward.
      #
      # --mixed rather than --soft matters. --soft leaves the index holding the
      # tree we checked out, so a source commit that landed mid-run would be
      # staged at its *old* content and the commit below would revert it.
      #
      # continue-on-error means that even in the worst case the page has already
      # been published by the step above.
      - name: Save the event database
        continue-on-error: true
        run: |
          git config user.name  "event-radar"
          git config user.email "actions@github.com"
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --mixed "origin/${GITHUB_REF_NAME}"
            git add -f events.db
            if git diff --staged --quiet; then
              echo "database unchanged, nothing to commit"
              exit 0
            fi
            # [skip ci] pairs with paths-ignore above: this commit must never
            # start another run of this workflow.
            git commit -m "radar: $(date -u +%Y-%m-%d) scan [skip ci]"
            if git push; then
              echo "database saved on attempt ${attempt}"
              exit 0
            fi
            echo "push attempt ${attempt} failed (something landed mid-run), retrying"
            sleep 5
          done
          echo "::warning::could not save events.db; the page deployed regardless"

  publish:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
